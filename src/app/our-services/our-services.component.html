<div class="services-section" id="our-services">
  <h2 class="services-title">Naše služby</h2>
  <div class="services-images">
    @for (item of img(); track item.picture) {
    <div class="service-image-wrapper">
      <img
        ngOptimizedImage
        [src]="item.picture"
        width="524"
        height="300"
        class="service-image"
        alt=""
      />
      <span class="service-label">
        {{ item.label }}
      </span>
    </div>
    }
  </div>
</div>
