<nav
  class="header"
  [class.header-scrolled]="scrolled()"
  (click)="scrollTop()"
  id="nav-menu"
>
  <img src="/assets/images/boostly.png" alt="image" class="image-boostly" />

  <div class="hamburger" (click)="toggleMenu()" tabindex="0">
    <span></span>
    <span></span>
    <span></span>
  </div>

  @if (!scrolled() && menuOpen()) {
  <div class="header-menu open">
    <div class="menu-sec-items">
      @for (elem of eachComponent(); track elem) {
      <a
        href="{{ elem.link }}"
        (click)="scrollDiv(elem.id)"
        class="{{ elem.class }}"
      >
        {{ elem.content }}
      </a>
      <div class="white-vertical"></div>
      }
    </div>
  </div>
  } @else if (!scrolled()) {
  <div class="header-menu">
    <div class="menu-sec-items">
      @for (elem of eachComponent(); track elem) {
      <a
        href="{{ elem.link }}"
        (click)="scrollDiv(elem.id)"
        class="{{ elem.class }}"
      >
        {{ elem.content }}
      </a>
      <div class="white-vertical"></div>
      }
    </div>
  </div>
  }
</nav>
